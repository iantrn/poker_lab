[package]
name = "pokerlab-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Modern Rust/wasm-bindgen output can use more than one table; the wasm-opt
# bundled by wasm-pack rejects that feature on some hosted runner images.
# Rust's release LTO/codegen optimization remains enabled above.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
