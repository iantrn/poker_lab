name: Temporary V2 npm lockfile bootstrap
# Temporary workflow: removed before the deployment pull request is opened.
# It runs only on this work branch and commits only frontend/package-lock.json.
on:
  push:
    branches: [chore/deploy-v2]
    paths: ['.github/workflows/lockfile-bootstrap.yml']

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: chore/deploy-v2
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix frontend
      - name: Verify npm ci from generated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix frontend
      - name: Verify strict TypeScript
        run: npm run typecheck --prefix frontend
      - name: Commit only the generated lockfile to the work branch
        run: |
          test -s frontend/package-lock.json
          git add -- frontend/package-lock.json
          git diff --cached --name-only
          test "$(git diff --cached --name-only)" = "frontend/package-lock.json"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(frontend): lock npm dependencies for reproducible V2 deploy'
          git push origin HEAD:refs/heads/chore/deploy-v2
