name: PokerLab automated tests

on:
  pull_request:
    paths:
      - "js/core/deck.js"
      - "js/core/evaluator.js"
      - "js/core/poker-rules.js"
      - "js/bots/bot-engine.js"
      - "js/bots/bot-profiles.js"
      - "js/core/game-engine.js"
      - "js/modules/training.js"
      - "js/modules/postflop-solver.js"
      - "js/modules/cfr-core.js"
      - "js/modules/postflop-strategy.js"
      - "js/modules/postflop-solver-ui.js"
      - "index.html"
      - "service-worker.js"
      - "manifest.json"
      - "assets/icons/**"
      - "css/style.css"
      - "tests/bot-engine.test.js"
      - "tests/game-engine.test.js"
      - "tests/postflop-solver.test.js"
      - "tests/postflop-strategy.test.js"
      - "tests/cfr-core.test.js"
      - "tests/learning-modules.test.js"
      - "tests/pwa-assets.test.mjs"
      - "data/lessons/lessons.json"
      - "data/puzzles/puzzles.json"
      - "data/ranges/preflop/matrix/**"
      - "tests/ranges/**"
      - "tools/ranges/**"
      - "js/app.js"
      - "js/modules/lessons.js"
      - "js/modules/puzzles.js"
      - "js/modules/game-review.js"
      - ".github/workflows/postflop-solver.yml"
  push:
    branches:
      - main
      - feature/postflop-solver-mvp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deck syntax
        run: node --check js/core/deck.js
      - name: Check poker rules syntax
        run: node --check js/core/poker-rules.js
      - name: Check bot engine syntax
        run: node --check js/bots/bot-engine.js
      - name: Check bot profiles syntax
        run: node --check js/bots/bot-profiles.js
      - name: Check game engine syntax
        run: node --check js/core/game-engine.js
      - name: Check training module syntax
        run: node --check js/modules/training.js
      - name: Check solver module syntax
        run: node --check js/modules/postflop-solver.js
      - name: Check CFR core syntax
        run: node --check js/modules/cfr-core.js
      - name: Check strategy module syntax
        run: node --check js/modules/postflop-strategy.js
      - name: Check solver UI syntax
        run: node --check js/modules/postflop-solver-ui.js
      - name: Check application bootstrap syntax
        run: node --check js/app.js
      - name: Check lessons module syntax
        run: node --check js/modules/lessons.js
      - name: Check puzzles module syntax
        run: node --check js/modules/puzzles.js
      - name: Check Game Review module syntax
        run: node --check js/modules/game-review.js
      - name: Check Service Worker syntax
        run: node --check service-worker.js
      - name: Run game engine and postflop solver tests
        run: node --test tests/game-engine.test.js tests/bot-engine.test.js tests/postflop-solver.test.js tests/postflop-strategy.test.js tests/cfr-core.test.js tests/learning-modules.test.js tests/pwa-assets.test.mjs tests/ranges/*.test.mjs
